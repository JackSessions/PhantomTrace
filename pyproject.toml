[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-trace-ntfs"            # the command you type is still `phantom-trace`
version = "0.5.0"
description = "Read-only NTFS cross-layer consistency checker for DFIR: finds where the MFT, bitmaps and run lists disagree"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
authors = [{ name = "Jack Sessions" }]
keywords = ["dfir", "forensics", "ntfs", "mft", "anti-forensics", "incident-response"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/JackSessions/PhantomTrace"
Source = "https://github.com/JackSessions/PhantomTrace"
Issues = "https://github.com/JackSessions/PhantomTrace/issues"

[project.scripts]
phantom-trace = "phantom_trace:main"
phantom-trace-gui = "phantom_trace_gui:main"

[tool.setuptools]
py-modules = ["phantom_trace", "phantom_trace_gui"]
